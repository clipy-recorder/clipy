# Public CI for Clipy Local. No secrets, read-only token, every action pinned
# to a full commit SHA. Runs on pushes to main and on pull requests, including
# pull requests from forks (`pull_request`, never `pull_request_target`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: filter
        name: Check if desktop CI is needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci-path-filter.mjs

  packages:
    name: Packages (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # With ffmpeg (x11grab, libx264), Xvfb and XTest present the capture
      # tests also record a real virtual display.
      - name: Install ffmpeg and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth libxtst6

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  desktop-macos:
    name: Clipy Local (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pnpm install --frozen-lockfile

      # The FFmpeg framework the recorder links against, and the app icons
      # that tauri's generate_context! embeds.
      - run: node scripts/setup-native-deps.mjs
      - run: pnpm tauri:icon

      - name: Window typecheck and build
        run: |
          pnpm exec tsc --noEmit
          pnpm run build

      # Two encoder tests check their output with ffprobe.
      - name: Install ffprobe
        run: brew install ffmpeg

      - name: Rust tests
        run: bash scripts/test-rust.sh --locked --lib

      - name: Local crates
        run: |
          (cd src-tauri/crates/clipy-local-edition && cargo test --locked)
          (cd src-tauri/crates/clipy-local-moments && cargo test --locked)
          # Without its on-device engine: the macOS app uses Apple Speech, and
          # the engine's build script would download an unchecked archive.
          (cd src-tauri/crates/clipy-local-stt && cargo test --locked --no-default-features)

      - name: Packaging tests
        run: node --test scripts/desktop-packaging.test.mjs scripts/speech-permissions.test.mjs

  desktop-windows:
    name: Clipy Local (Windows compile)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # gyan.dev's shared FFmpeg 7 build: libx264, AAC and the headers
      # ffmpeg-sys-next's bindgen needs. Checked against a pinned SHA-256.
      - name: Download FFmpeg shared build
        working-directory: ${{ github.workspace }}
        env:
          FFMPEG_WIN_URL: "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.7z"
          FFMPEG_WIN_SHA256: "01915dfe8591248be20d3d83453c91c1f71cfd10c07460e6fa2d2e667f513606"
          FFMPEG_ARCHIVE_NAME: "ffmpeg-7.1-full_build-shared"
        run: |
          $dst = "$env:RUNNER_TEMP\ffmpeg.7z"
          Invoke-WebRequest -Uri $env:FFMPEG_WIN_URL -OutFile $dst
          $actualHash = (Get-FileHash -Path $dst -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:FFMPEG_WIN_SHA256) {
            throw "FFmpeg archive checksum mismatch: $actualHash"
          }
          7z x $dst -o"$env:RUNNER_TEMP\ffmpeg-extracted" -y | Out-Null
          $stable = "$env:RUNNER_TEMP\ffmpeg"
          Move-Item -Path (Join-Path $env:RUNNER_TEMP "ffmpeg-extracted\$env:FFMPEG_ARCHIVE_NAME") -Destination $stable
          Get-ChildItem "$stable\include\libavcodec\avcodec.h" | Out-Null
          Get-ChildItem "$stable\lib\avcodec.lib" | Out-Null
          "FFMPEG_DIR=$stable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$stable\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri:icon
      - run: pnpm run build

      # tauri-build resolves bundle resources in build.rs, so the FFmpeg DLLs
      # and the segmentation runtime must be staged before cargo runs.
      - name: Stage FFmpeg DLLs and segmentation assets
        run: |
          node scripts/stage-ffmpeg-dlls.mjs
          node scripts/stage-segmentation-assets.mjs

      # Downloads the pinned sherpa-onnx archive, checks its SHA-256, and hands
      # the folder to the build so sherpa-onnx-sys never fetches its own copy.
      - name: Stage sherpa-onnx
        run: |
          $line = node scripts/stage-sherpa-onnx.mjs | Where-Object { $_ -like 'SHERPA_ONNX_ARCHIVE_DIR=*' }
          if (-not $line) { throw "stage-sherpa-onnx.mjs did not print SHERPA_ONNX_ARCHIVE_DIR" }
          $line | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked
