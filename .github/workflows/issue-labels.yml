# Labels issues from the "Bug in a Clipy app" and "Feature request" forms by
# the product picked in them (app: chrome-extension, app: ios, ...), labels
# issues from the "Bug in the code here" form by the area picked in it
# (area: desktop, area: packages, area: docs), and makes sure the labels the
# templates use exist. Runs only on issue events and on a manual run; it checks
# out no code and runs nothing from the issue. The issue body reaches the
# script through an environment variable, never through ${{ }} in the script,
# so its text cannot become a command.
name: Issue labels

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: issue-labels-${{ github.event.issue.number || github.run_id }}

jobs:
  label:
    name: Label by product and area
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Make sure the labels exist
        run: |
          ensure() {
            gh label create "$1" --color "$2" --description "$3" 2>/dev/null || true
          }
          ensure "app-bug"              "d73a4a" "A bug in one of the Clipy apps"
          ensure "needs-triage"         "fbca04" "Waiting for the Clipy team to reproduce it"
          ensure "confirmed"            "0e8a16" "The Clipy team reproduced it"
          ensure "app: chrome-extension" "1d76db" "Clipy for Chrome"
          ensure "app: ios"             "1d76db" "Clipy for iPhone and iPad"
          ensure "app: android"         "1d76db" "Clipy for Android"
          ensure "app: web"             "1d76db" "The web app at clipy.online"
          ensure "app: desktop"         "1d76db" "The desktop app from clipy.online/download"
          ensure "good first issue"     "7057ff" "A small, well-scoped first contribution"
          ensure "help wanted"          "008672" "Larger work we would love help with"
          ensure "hiring-cohort"        "c5def5" "Suitable for a hiring batch; open to everyone"
          ensure "platform: Linux"      "bfdadc" "Linux"
          ensure "platform: Windows"    "bfdadc" "Windows"
          ensure "platform: macOS"      "bfdadc" "macOS"
          ensure "area: desktop"        "c2e0c6" "The desktop app in desktop/"
          ensure "area: packages"       "c2e0c6" "The TypeScript packages in packages/"
          ensure "area: plugins"        "c2e0c6" "The Claude Code plugins and skills in plugins/"
          ensure "area: docs"           "c2e0c6" "READMEs, guides and examples"

      - name: Add the product label
        if: github.event_name == 'issues'
        env:
          NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
        run: |
          # A form answer sits two lines under its "### Product" heading.
          product=$(printf '%s\n' "$BODY" | tr -d '\r' | awk '/^### Product$/ { getline; getline; print; exit }')
          case "$product" in
            "Chrome extension")                       label="app: chrome-extension" ;;
            "iPhone or iPad app")                     label="app: ios" ;;
            "Android app")                            label="app: android" ;;
            "Web app (clipy.online)")                 label="app: web" ;;
            "Desktop app from clipy.online/download") label="app: desktop" ;;
            *) echo "No app picked; nothing to label."; exit 0 ;;
          esac
          # On an edit, drop a product label the issue no longer matches.
          for old in $(gh issue view "$NUMBER" --json labels --jq '.labels[].name | select(startswith("app: ")) | @base64'); do
            name=$(printf '%s' "$old" | base64 -d)
            [ "$name" = "$label" ] || gh issue edit "$NUMBER" --remove-label "$name"
          done
          gh issue edit "$NUMBER" --add-label "$label"

      - name: Add the area label
        if: github.event_name == 'issues'
        env:
          NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
        run: |
          # A form answer sits two lines under its "### Area" heading.
          area=$(printf '%s\n' "$BODY" | tr -d '\r' | awk '/^### Area$/ { if (getline > 0 && getline > 0) { gsub(/^[ \t]+|[ \t]+$/, ""); print } exit }')
          case "$area" in
            "Clipy desktop app")
              label="area: desktop" ;;
            "packages/moments"|"packages/config"|"packages/capture"|"packages/transcribe"|"clipy CLI with --local")
              label="area: packages" ;;
            "Docs")
              label="area: docs" ;;
            *)
              echo "No area picked; nothing to label."; exit 0 ;;
          esac
          # On an edit, drop stale area: labels and skip adding if already present.
          has_label=false
          for old in $(gh issue view "$NUMBER" --json labels --jq '.labels[].name | select(startswith("area:")) | @base64'); do
            name=$(printf '%s' "$old" | base64 -d)
            if [ "$name" = "$label" ]; then
              has_label=true
            else
              gh issue edit "$NUMBER" --remove-label "$name"
            fi
          done
          if [ "$has_label" = false ]; then
            gh issue edit "$NUMBER" --add-label "$label"
          fi
